name: Release Automático (SemVer)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Gerar Release e Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Executar Release-Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Se uma nova release foi publicada (o PR de release foi mergeado na main)
      - name: Checkout do código pós-release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sincronizar versão no client/index.html e Index.html
        if: ${{ steps.release.outputs.release_created }}
        run: |
          NEW_VERSION="${{ steps.release.outputs.version }}"
          echo "Sincronizando interfaces para a versão: v$NEW_VERSION"
          sed -i -E "s/id=\"app-version\">v[0-9]+\.[0-9]+\.[0-9]+/id=\"app-version\">v$NEW_VERSION/g" client/index.html
          if [ -f "Index.html" ]; then
            sed -i -E "s/id=\"app-version\">v[0-9]+\.[0-9]+\.[0-9]+/id=\"app-version\">v$NEW_VERSION/g" Index.html
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet client/index.html Index.html; then
            git add client/index.html Index.html
            git commit -m "chore(release): atualizar badge da interface para v$NEW_VERSION [skip ci]"
            git push origin main
          fi

      # Deploy automático garantido em Produção após a publicação da Release
      - name: Conectar à rede privada Tailscale para Deploy
        if: ${{ steps.release.outputs.release_created }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar chave de acesso SSH
        if: ${{ steps.release.outputs.release_created }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Executar Deploy em Produção (PROD)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "🚀 Disparando deploy automático pós-release em Produção (PROD)..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -s -- 'cargave-prod' 'kwhub-prod' 'main'" < scripts/deploy_vps.sh
          echo "🎉 Deploy de Produção v${{ steps.release.outputs.version }} concluído com sucesso!"
